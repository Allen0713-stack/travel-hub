<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TravelHub 探索世界 | 旅遊景點與行程預約指南</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans TC"', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans antialiased">

  <!-- 頂部導航列 -->
  <header class="bg-white/90 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">✈️</span>
        <span class="font-extrabold text-xl bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">TravelHub</span>
      </div>
      <nav class="hidden md:flex items-center space-x-6 text-sm font-medium text-slate-600">
        <a href="#destinations" class="hover:text-blue-600 transition">熱門景點</a>
        <a href="#about" class="hover:text-blue-600 transition">關於我們</a>
      </nav>
      <div class="flex items-center space-x-3">
        <button id="favoriteCountBtn" class="flex items-center space-x-1.5 px-3.5 py-1.5 rounded-full bg-rose-50 text-rose-600 text-sm font-semibold border border-rose-200">
          <span>❤️ 收藏清單</span>
          <span id="favBadge" class="bg-rose-500 text-white text-xs px-2 py-0.5 rounded-full">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero 英雄橫幅區 -->
  <section class="relative bg-gradient-to-br from-blue-700 via-indigo-700 to-purple-800 text-white py-16 px-4 sm:px-6">
    <div class="max-w-4xl mx-auto text-center">
      <span class="inline-block py-1 px-3.5 rounded-full bg-white/20 text-xs font-semibold tracking-wider uppercase backdrop-blur-md mb-4">
        🌏 跨設備協同開發示範專案 · V2.0
      </span>
      <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight mb-4">
        開啟你的下一趟精彩旅程
      </h1>
      <p class="text-blue-100 text-base sm:text-lg mb-8 max-w-2xl mx-auto">
        搜尋世界各地的夢幻名勝，即時查看氣候指標與行程諮詢。
      </p>

      <!-- 搜尋與篩選列 -->
      <div class="bg-white p-2 sm:p-3 rounded-2xl shadow-xl max-w-2xl mx-auto flex flex-col sm:flex-row gap-2">
        <div class="relative flex-1">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">🔍</span>
          <input
            id="searchInput"
            type="text"
            placeholder="搜尋國家、城市、極光、海島或景點名稱..."
            class="w-full pl-10 pr-4 py-2.5 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
          />
        </div>
        <select id="categorySelect" class="bg-slate-100 text-slate-700 px-4 py-2.5 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
          <option value="all">所有分類 (全部)</option>
          <option value="asia">亞洲精選</option>
          <option value="europe">歐洲風情</option>
          <option value="nature">自然與海島</option>
          <option value="culture">歷史人文</option>
        </select>
      </div>
    </div>
  </section>

  <!-- 主內容區 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1 w-full" id="destinations">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h2 class="text-2xl font-bold text-slate-900">熱門精選景點</h2>
        <p class="text-slate-500 text-sm mt-1">包含即時天氣指標與行程預約推薦</p>
      </div>
      <div id="resultCount" class="text-sm font-semibold text-slate-500">共 8 個景點</div>
    </div>

    <!-- 景點卡片網格 -->
    <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
      <!-- 卡片由 app.js 動態渲染 -->
    </div>
  </main>

  <!-- 預約諮詢 Modal 彈窗 -->
  <div id="bookingModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl relative animate-in fade-in zoom-in duration-200">
      <button onclick="closeBookingModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
      <div class="text-center mb-5">
        <span class="text-3xl inline-block mb-2">🏖️</span>
        <h3 id="modalTitle" class="text-lg font-bold text-slate-900">預約諮詢</h3>
        <p id="modalLocation" class="text-xs text-blue-600 font-semibold mt-1"></p>
      </div>
      <form onsubmit="submitBooking(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">您的姓名</label>
          <input id="guestName" type="text" required placeholder="例如：陳大明" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">預計出發日期</label>
          <input id="travelDate" type="date" required class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">同行人數</label>
          <select id="guestCount" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="1">1 位</option>
            <option value="2" selected>2 位 (推薦)</option>
            <option value="3-4">3 ~ 4 位</option>
            <option value="5+">5 位以上 (團體)</option>
          </select>
        </div>
        <div class="pt-3 flex gap-3">
          <button type="button" onclick="closeBookingModal()" class="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50 transition">取消</button>
          <button type="submit" class="flex-1 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold shadow-md transition">確認送出</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast 提示通知元件 -->
  <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl text-sm font-semibold transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center space-x-2">
  </div>

  <!-- 頁尾 -->
  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
    <p>© 2026 TravelHub 跨電腦協同開發範例專案 · Built with Git & GitHub Desktop</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
